name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==12.1.1
      - run: python tools/check.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sheet
          path: sheet.png
          if-no-files-found: ignore
